<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive User Stream Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .actions {
            margin-bottom: 12px;
        }

        button {
            margin-right: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
        }

        #status {
            margin: 10px 0;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
<h2>Reactive User Stream (SSE)</h2>

<div class="actions">
    <button id="fetchBtn">Fetch User Data</button>
    <button id="clearBtn">Clear User Data</button>
</div>

<div id="status">Status: Idle</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>
    </thead>
    <tbody id="userTableBody"></tbody>
</table>

<script src="./app.js"></script>
</body>
</html>
